<!--
  書いたものは、この端末のブラウザの中（IndexedDB）にだけ、端末で作った鍵で暗号にして置く。
  外へ送る処理・外部の読み込み・解析は一切ない。守りの考え方は SECURITY.md。
-->
<style>
:root {
  --bg: #f6f3ea;
  --paper: #fff3a8;
  --paper-line: #eedf7a;
  --ink: #2b2a26;
  --sub: #8a857a;
  --row: #ffffff;
  --row-line: #e7e2d6;
  --check: #2f9e5b;
  --done-bg: #eceae3;
  --swipe: #2f9e5b;
  --swipe-del: #c94a3d;
  --btn: #2b2a26;
  --btn-ink: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a17;
    --paper: #4a4320;
    --paper-line: #5d5428;
    --ink: #eeeae0;
    --sub: #9a958a;
    --row: #262521;
    --row-line: #34322c;
    --check: #4cc27c;
    --done-bg: #211f1c;
    --swipe: #2f8a52;
    --swipe-del: #a8433a;
    --btn: #eeeae0;
    --btn-ink: #1b1a17;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  touch-action: manipulation;
  max-width: 640px;
  margin: 0 auto;
}

#paper {
  display: block;
  background: var(--paper);
  border-radius: 6px 6px 18px 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  padding: 14px 16px;
  cursor: text;
}
#pad {
  display: block;
  width: 100%;
  min-height: 7.5em;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 19px;
  line-height: 1.6;
  padding: 0;
  background-image: linear-gradient(transparent calc(1.6em - 1px), var(--paper-line) 1px);
  background-size: 100% 1.6em;
  overflow: hidden;
}
#pad::placeholder { color: var(--sub); }

#add {
  display: block;
  width: 100%;
  margin: 10px 0 18px;
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  background: var(--btn);
  color: var(--btn-ink);
  font: inherit;
  font-weight: 600;
  letter-spacing: .05em;
}
#add:disabled { opacity: .25; }

ul { list-style: none; margin: 0; padding: 0; }
li {
  position: relative;
  margin: 0 0 8px;
  border-radius: 12px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
li .under {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  color: #fff; font-weight: 700; font-size: 22px;
  background: var(--swipe);
}
li.is-done .under { background: var(--swipe-del); }
li .face {
  position: relative;
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--row);
  border: 1px solid var(--row-line);
  border-radius: 12px;
  padding: 10px 12px 10px 6px;
  min-height: 52px;
  will-change: transform;
}
li.is-done .face { background: var(--done-bg); }
li.is-done .txt { color: var(--sub); text-decoration: line-through; }
.chk {
  flex: none;
  width: 44px; height: 32px;
  border: 0; background: none; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
.chk span {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--sub);
  display: flex; align-items: center; justify-content: center;
  color: transparent; font-size: 15px; font-weight: 800;
}
li.is-done .chk span { background: var(--check); border-color: var(--check); color: #fff; }
.txt {
  flex: 1; min-width: 0;
  white-space: pre-wrap; word-break: break-word;
  padding-top: 3px;
  outline: 0;
}
.txt[contenteditable="true"] {
  -webkit-user-select: text; user-select: text;
  background: var(--paper);
  border-radius: 6px;
  margin: -2px -6px; padding: 5px 6px 2px;
}
li.lift { z-index: 5; overflow: visible; }
li.lift .face { box-shadow: 0 10px 24px rgba(0,0,0,.25); transform: scale(1.03); }
li.lift .under { display: none; }
li.slot .face { transition: transform .15s; }

#doneHead {
  display: none;
  margin: 22px 0 10px;
  border: 0; background: none; padding: 6px 2px;
  color: var(--sub); font: inherit; font-size: 15px;
}
#doneHead.show { display: block; }
#doneList.hide { display: none; }
#doneMore { margin: 4px 4px 0; color: var(--sub); font-size: 13px; }
#doneMore:empty { display: none; }

#toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom));
  transform: translate(-50%, 140%);
  transition: transform .2s;
  background: var(--btn); color: var(--btn-ink);
  border-radius: 24px; padding: 6px 6px 6px 18px;
  display: flex; align-items: center; gap: 12px;
  font-size: 15px; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
#toast.show { transform: translate(-50%, 0); }
#toast button {
  border: 0; border-radius: 18px; min-height: 36px; padding: 0 14px;
  background: var(--btn-ink); color: var(--btn); font: inherit; font-weight: 700;
}

#exp {
  display: none;
  margin: 28px auto 0;
  border: 1px solid var(--row-line); border-radius: 22px;
  background: none; color: var(--sub);
  font: inherit; font-size: 15px;
  min-height: 44px; padding: 0 22px;
}
#exp.show { display: block; }

#hint {
  display: none;
  margin: 28px 4px 0;
  color: var(--sub); font-size: 13px; line-height: 1.6;
}
#hint.show { display: block; }
</style>
</head>
<body>

<label id="paper" for="pad">
  <textarea id="pad" placeholder="ここに書く" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></textarea>
</label>
<button id="add" type="button" disabled>↓ リストへ</button>

<ul id="list"></ul>

<button id="doneHead" type="button"></button>
<ul id="doneList" class="hide"></ul>
<p id="doneMore"></p>

<button id="exp" type="button">まだの分をコピー</button>

<p id="hint">共有ボタン →「ホーム画面に追加」で、次からアイコンですぐ開けます。</p>

<div id="toast"><span id="toastMsg"></span><button id="undo" type="button">元に戻す</button></div>

<script>
(function () {
  'use strict';

  // 他のサイトの枠（iframe）の中では何もしない。メモも読み込まない
  if (window.top !== window.self) {
    document.documentElement.textContent = '';
    return;
  }

  // 保存は IndexedDB に暗号文で置く。鍵はこの端末のブラウザが作り、取り出せない形（extractable: false）で持つ
  var DB_NAME = 'memo';
  var OLD_KEY = 'memo_v1';   // 平文で localStorage に置いていた頃の保存。見つけたら暗号にして消す
  // 済みは開いたときだけ描く。描くのは新しい方からこの件数まで
  var DONE_SHOW = 300;
  // この時間より長く裏にいたら、戻ったときに書きかけを付箋として下ろし、新しい紙にする
  var AWAY_MS = 3 * 60 * 1000;

  var pad = document.getElementById('pad');
  var addBtn = document.getElementById('add');
  var listEl = document.getElementById('list');
  var doneEl = document.getElementById('doneList');
  var doneHead = document.getElementById('doneHead');
  var toast = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  var undoBtn = document.getElementById('undo');
  var hint = document.getElementById('hint');
  var doneMore = document.getElementById('doneMore');

  var state = { draft: '', hiddenAt: 0, items: [] };
  var doneOpen = false;
  var ready = false;

  // ---- 暗号つきの保存 ----

  var db = null, key = null, saveFailed = false;

  function req(r) {
    return new Promise(function (res, rej) {
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function openDb() {
    var r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = function () {
      r.result.createObjectStore('key');    // 'main' → CryptoKey
      r.result.createObjectStore('data');   // 'items' / 'draft' → { iv, ct }
    };
    return req(r);
  }
  function getKey() {
    return req(db.transaction('key').objectStore('key').get('main')).then(function (k) {
      if (k) return k;
      return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']).then(function (nk) {
        // 別のタブが先に作っていたら（add が失敗）、そちらを使う
        return req(db.transaction('key', 'readwrite').objectStore('key').add(nk, 'main')).then(function () { return nk; }, function () {
          return req(db.transaction('key').objectStore('key').get('main')).then(function (k2) {
            if (!k2) throw new Error('no key');
            return k2;
          });
        });
      });
    });
  }
  function seal(obj) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var plain = new TextEncoder().encode(JSON.stringify(obj));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plain).then(function (ct) { return { iv: iv, ct: ct }; });
  }
  function unseal(rec) {
    if (!rec || !rec.iv || !rec.ct) return Promise.resolve(null);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: rec.iv }, key, rec.ct).then(function (buf) {
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }
  // 書き込みは来た順に 1 本ずつ。暗号化が終わった順で前後しないように
  var queue = Promise.resolve();
  function put(name, obj) {
    if (!db || !key) return;
    queue = queue.then(function () {
      return seal(obj).then(function (rec) {
        return req(db.transaction('data', 'readwrite').objectStore('data').put(rec, name));
      });
    }).then(function () {
      saveFailed = false;
    }, function () {
      if (!saveFailed) showToast('保存できませんでした（端末の空きを確認）', null);
      saveFailed = true;
    });
  }
  function save() { put('items', { items: state.items }); }
  function saveDraft() { put('draft', { draft: state.draft, hiddenAt: state.hiddenAt }); }

  // 保存の中身は形を確かめてから使う（壊れていても落ちない）
  function clean(raw) {
    var out = [];
    if (!raw || !Array.isArray(raw.items)) return out;
    raw.items.forEach(function (it) {
      if (!it || typeof it.t !== 'string' || typeof it.id !== 'string') return;
      var o = { id: it.id, t: it.t, done: it.done === true, at: typeof it.at === 'number' ? it.at : 0 };
      if (o.done && typeof it.doneAt === 'number') o.doneAt = it.doneAt;
      out.push(o);
    });
    return out;
  }

  function load() {
    return openDb().then(function (d) {
      db = d;
      return getKey();
    }).then(function (k) {
      key = k;
      var st = db.transaction('data').objectStore('data');
      return Promise.all([req(st.get('items')), req(st.get('draft'))]);
    }).then(function (recs) {
      // 鍵が合わない・壊れている記録は読めないので空として扱う
      return Promise.all(recs.map(function (r) { return unseal(r).catch(function () { return null; }); }));
    }).then(function (vals) {
      state.items = clean(vals[0]);
      var dr = vals[1];
      if (dr && typeof dr.draft === 'string') state.draft = dr.draft;
      if (dr && typeof dr.hiddenAt === 'number') state.hiddenAt = dr.hiddenAt;
      migrateOld();
    });
  }
  // 前の版の平文を取り込み、暗号で書き直してから平文を消す
  function migrateOld() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(OLD_KEY)); } catch (e) {}
    if (!raw) return;
    var old = clean(raw);
    var have = {};
    state.items.forEach(function (it) { have[it.id] = 1; });
    old.forEach(function (it) { if (!have[it.id]) state.items.push(it); });
    if (typeof raw.draft === 'string' && raw.draft && !state.draft) state.draft = raw.draft;
    save(); saveDraft();
    queue.then(function () {
      if (!saveFailed) { try { localStorage.removeItem(OLD_KEY); } catch (e) {} }
    });
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---- 紙（書く場所） ----

  function fit() {
    pad.style.height = 'auto';
    pad.style.height = pad.scrollHeight + 'px';
  }
  function syncAdd() { addBtn.disabled = !pad.value.trim(); }

  // 書きかけを付箋としてリストの先頭へ
  function commitDraft() {
    var t = pad.value.replace(/\s+$/, '').replace(/^\s*\n/, '');
    if (!t.trim()) return false;
    state.items.unshift({ id: uid(), t: t, done: false, at: Date.now() });
    pad.value = '';
    state.draft = '';
    save(); saveDraft();
    fit(); syncAdd(); render();
    return true;
  }

  // 打つたびに保存するのは書きかけだけ（一覧は変わったときだけ）。件数が増えても打つ速さが落ちない
  pad.addEventListener('input', function () {
    if (!ready) return;
    state.draft = pad.value;
    saveDraft();
    fit(); syncAdd();
  });

  // ボタンを押しても紙からフォーカスを外さない（キーボードを出したまま次を書ける）
  addBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  addBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  addBtn.addEventListener('click', function () {
    commitDraft();
    pad.focus();
  });

  document.addEventListener('visibilitychange', function () {
    if (!ready) return;
    if (document.visibilityState === 'hidden') {
      state.hiddenAt = Date.now();
      saveDraft();
    } else if (state.hiddenAt && Date.now() - state.hiddenAt > AWAY_MS) {
      commitDraft();
      state.hiddenAt = 0;
      saveDraft();
    }
  });

  // ---- リスト ----

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function rowFor(it) {
    var li = el('li', it.done ? 'is-done' : '');
    li.dataset.id = it.id;
    var under = el('div', 'under');
    under.appendChild(el('span', '', it.done ? '✕' : '✓'));
    under.appendChild(el('span', '', it.done ? '✕' : '✓'));
    var face = el('div', 'face');
    var chk = el('button', 'chk');
    chk.type = 'button';
    chk.setAttribute('aria-label', it.done ? '戻す' : '済み');
    chk.appendChild(el('span', '', '✓'));
    var txt = el('div', 'txt', it.t);
    face.appendChild(chk);
    face.appendChild(txt);
    li.appendChild(under);
    li.appendChild(face);
    return li;
  }

  function render() {
    listEl.textContent = '';
    doneEl.textContent = '';
    var nDone = 0;
    state.items.forEach(function (it) {
      if (it.done) {
        nDone++;
        if (doneOpen && nDone <= DONE_SHOW) doneEl.appendChild(rowFor(it));
      } else listEl.appendChild(rowFor(it));
    });
    doneMore.textContent = doneOpen && nDone > DONE_SHOW ? 'ほかに古い済みが ' + (nDone - DONE_SHOW) + ' 件' : '';
    doneHead.textContent = '済み ' + nDone + (doneOpen ? '  ▴' : '  ▾');
    doneHead.classList.toggle('show', nDone > 0);
    doneEl.classList.toggle('hide', !doneOpen);
    hint.classList.toggle('show', !standalone());
    document.getElementById('exp').classList.toggle('show', state.items.some(function (it) { return !it.done; }));
  }

  function find(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return i;
    return -1;
  }

  doneHead.addEventListener('click', function () { doneOpen = !doneOpen; render(); });

  // ---- 元に戻す ----

  var undoSnap = null, toastTimer = 0;
  function snapshot() { return JSON.stringify(state.items); }
  function showToast(msg, snap) {
    undoSnap = snap;
    toastMsg.textContent = msg;
    undoBtn.style.display = snap ? '' : 'none';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); undoSnap = null; }, 5000);
  }
  undoBtn.addEventListener('click', function () {
    if (undoSnap) { state.items = JSON.parse(undoSnap); save(); render(); }
    undoSnap = null;
    toast.classList.remove('show');
  });

  // 済みにする / 戻す（済みの行を払ったときは消す）
  function toggleDone(id) {
    var i = find(id); if (i < 0) return;
    var snap = snapshot();
    var it = state.items[i];
    state.items.splice(i, 1);
    if (!it.done) {
      it.done = true; it.doneAt = Date.now();
      state.items.unshift(it);   // 済みの中では新しい順
      showToast('済みにしました', snap);
    } else {
      it.done = false; delete it.doneAt;
      state.items.unshift(it);
      showToast('リストに戻しました', snap);
    }
    save(); render();
  }
  function remove(id, msg) {
    var i = find(id); if (i < 0) return;
    var snap = snapshot();
    state.items.splice(i, 1);
    save(); render();
    showToast(msg || '消しました', snap);
  }

  // ---- 行の書き直し ----

  var editing = null;
  function startEdit(li) {
    if (editing) endEdit();
    var txt = li.querySelector('.txt');
    editing = { li: li, txt: txt };
    // 文字だけを受け付ける（貼り付けで画像や書式が入らないように）
    try { txt.contentEditable = 'plaintext-only'; } catch (e) {}
    if (txt.contentEditable !== 'plaintext-only') txt.contentEditable = 'true';
    txt.focus();
    var r = document.createRange();
    r.selectNodeContents(txt); r.collapse(false);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    txt.addEventListener('blur', endEdit, { once: true });
    txt.addEventListener('paste', pastePlain);
    txt.addEventListener('drop', noDrop);
  }
  function endEdit() {
    if (!editing) return;
    var e = editing; editing = null;
    var id = e.li.dataset.id;
    var t = e.txt.innerText.replace(/\s+$/, '');
    e.txt.contentEditable = 'false';
    e.txt.removeEventListener('paste', pastePlain);
    e.txt.removeEventListener('drop', noDrop);
    e.txt.textContent = t;   // 何が入っていても素の文字に戻す
    var i = find(id); if (i < 0) return;
    if (!t.trim()) { remove(id); return; }
    if (t !== state.items[i].t) { state.items[i].t = t; save(); }
  }

  function pastePlain(ev) {
    ev.preventDefault();
    var t = (ev.clipboardData && ev.clipboardData.getData('text/plain')) || '';
    if (t) document.execCommand('insertText', false, t);
  }
  function noDrop(ev) { ev.preventDefault(); }

  // ---- 指の動き: タップ / 払う / 長押しで並べ替え ----

  var HOLD_MS = 420, SLOP = 9;
  var g = null;   // 進行中の動き

  function rowOf(target) {
    var li = target.closest && target.closest('li');
    return li && (listEl.contains(li) || doneEl.contains(li)) ? li : null;
  }

  function begin(x, y, target) {
    var li = rowOf(target);
    if (!li) return;
    if (editing && editing.li === li) return;   // 書き直し中はふつうの文字操作
    g = { li: li, face: li.querySelector('.face'), x0: x, y0: y, x: x, y: y,
          mode: 'wait', onChk: !!target.closest('.chk'), timer: 0 };
    g.timer = setTimeout(function () { if (g && g.mode === 'wait') startDrag(); }, HOLD_MS);
  }

  function move(x, y) {
    if (!g) return false;
    g.x = x; g.y = y;
    var dx = x - g.x0, dy = y - g.y0;
    if (g.mode === 'wait') {
      if (Math.abs(dx) > SLOP && Math.abs(dx) > Math.abs(dy) * 1.3) {
        clearTimeout(g.timer); g.mode = 'swipe';
      } else if (Math.abs(dy) > SLOP || Math.abs(dx) > SLOP) {
        clearTimeout(g.timer); g = null; return false;   // 縦はスクロールに任せる
      } else return false;
    }
    if (g.mode === 'swipe') {
      g.face.style.transition = 'none';
      g.face.style.transform = 'translateX(' + dx + 'px)';
      return true;
    }
    if (g.mode === 'drag') { dragMove(); return true; }
    return false;
  }

  function end() {
    if (!g) return;
    var cur = g; g = null;
    clearTimeout(cur.timer);
    if (cur.mode === 'wait') {
      // タップ
      if (cur.onChk) toggleDone(cur.li.dataset.id);
      else if (!cur.li.classList.contains('is-done')) startEdit(cur.li);
      return;
    }
    if (cur.mode === 'swipe') {
      var dx = cur.x - cur.x0, w = cur.li.offsetWidth;
      if (Math.abs(dx) > w * 0.33) {
        cur.face.style.transition = 'transform .15s';
        cur.face.style.transform = 'translateX(' + (dx > 0 ? w : -w) + 'px)';
        setTimeout(function () {
          if (cur.li.classList.contains('is-done')) remove(cur.li.dataset.id);
          else toggleDone(cur.li.dataset.id);
        }, 150);
      } else {
        cur.face.style.transition = 'transform .15s';
        cur.face.style.transform = '';
      }
      return;
    }
    if (cur.mode === 'drag') dragEnd(cur);
  }

  function cancel() {
    if (!g) return;
    var cur = g; g = null;
    clearTimeout(cur.timer);
    if (cur.mode === 'swipe') { cur.face.style.transform = ''; }
    if (cur.mode === 'drag') dragEnd(cur);
  }

  // 並べ替え: 持ち上げた行を指に追従させ、他の行を詰める
  function startDrag() {
    if (editing) endEdit();
    var li = g.li;
    var parent = li.parentNode;
    g.mode = 'drag';
    g.parent = parent;
    g.rows = Array.prototype.slice.call(parent.children);
    g.from = g.rows.indexOf(li);
    g.to = g.from;
    g.tops = g.rows.map(function (r) { return r.getBoundingClientRect().top; });
    g.h = li.getBoundingClientRect().height + 8;
    li.classList.add('lift');
    g.rows.forEach(function (r) { if (r !== li) r.classList.add('slot'); });
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }
  function dragMove() {
    var dy = g.y - g.y0;
    g.face.style.transition = 'none';
    g.face.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
    var mid = g.tops[g.from] + dy + g.h / 2;
    // 持ち上げた行の中心より上にある行の数 = 落とす位置
    var to = 0;
    for (var j = 0; j < g.rows.length; j++) {
      if (j === g.from) continue;
      var c = g.tops[j] + g.rows[j].offsetHeight / 2;
      if (mid > c) to++;
    }
    g.to = to;
    for (var k = 0; k < g.rows.length; k++) {
      if (k === g.from) continue;
      var f = g.rows[k].querySelector('.face');
      var shift = 0;
      if (g.from < g.to && k > g.from && k <= g.to) shift = -g.h;
      if (g.from > g.to && k >= g.to && k < g.from) shift = g.h;
      f.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    }
    // 端で自動スクロール
    var vh = window.innerHeight;
    if (g.y < 60) window.scrollBy(0, -8);
    else if (g.y > vh - 60) window.scrollBy(0, 8);
  }
  function dragEnd(cur) {
    cur.rows.forEach(function (r) {
      r.classList.remove('lift', 'slot');
      r.querySelector('.face').style.transform = '';
      r.querySelector('.face').style.transition = '';
    });
    if (cur.to === cur.from) return;
    // 同じ種類（未済み / 済み）の中での並び順を全体の配列へ反映
    var ids = cur.rows.map(function (r) { return r.dataset.id; });
    var moved = ids.splice(cur.from, 1)[0];
    ids.splice(cur.to, 0, moved);
    var isDone = cur.parent === doneEl;
    var shown = {};
    ids.forEach(function (id) { shown[id] = 1; });
    var mine = ids.map(function (id) { return state.items[find(id)]; });
    var open = state.items.filter(function (it) { return !it.done && !shown[it.id]; });
    var done = state.items.filter(function (it) { return it.done && !shown[it.id]; });
    state.items = isDone ? open.concat(mine, done) : mine.concat(done);
    save(); render();
  }

  // タッチ（iPhone）
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { cancel(); return; }
    var t = e.touches[0];
    begin(t.clientX, t.clientY, e.target);
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!g) return;
    var t = e.touches[0];
    if (move(t.clientX, t.clientY)) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (!g) return;
    if (g.mode !== 'wait' || rowOf(e.target)) e.preventDefault();  // 後から来るクリックを抑える
    end();
  }, { passive: false });
  document.addEventListener('touchcancel', cancel);

  // マウス（PC で触るとき）
  var mouseDown = false;
  document.addEventListener('mousedown', function (e) {
    if (e.button !== 0 || ('ontouchstart' in window && e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents)) return;
    mouseDown = true;
    begin(e.clientX, e.clientY, e.target);
  });
  document.addEventListener('mousemove', function (e) { if (mouseDown && g) { if (move(e.clientX, e.clientY)) e.preventDefault(); } });
  document.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; end(); } });

  // 長押しメニューを出さない
  document.addEventListener('contextmenu', function (e) { if (rowOf(e.target)) e.preventDefault(); });

  // ---- 全部コピー ----
  // 純正メモ帳に貼って ○（チェックリスト）にできる形: 済みでないものだけ、1 件 1 行、記号なし。
  // メモ帳は貼った記号をチェックに変えないので、行頭に何も付けない。1 件の中の改行は空白にする

  function toText() {
    return state.items.filter(function (it) { return !it.done; }).map(function (it) {
      return it.t.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).join(' ');
    }).join('\n');
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).catch(function () { return copyOld(t); });
    }
    return Promise.resolve(copyOld(t));
  }
  function copyOld(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.fontSize = '16px';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (!ok) throw new Error('copy');
  }
  document.getElementById('exp').addEventListener('click', function () {
    copyText(toText()).then(function () { showToast('コピーしました', null); },
                            function () { showToast('コピーできませんでした', null); });
  });

  // ---- その他 ----

  function standalone() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }

  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist(); } catch (e) {}
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // Trusted Types を強制しているので、登録する URL は決め打ちの 1 つだけ通す
    var swUrl = 'sw.js';
    if (window.trustedTypes && window.trustedTypes.createPolicy) {
      swUrl = window.trustedTypes.createPolicy('memo', {
        createScriptURL: function (u) { if (u !== 'sw.js') throw new Error('blocked'); return u; }
      }).createScriptURL('sw.js');
    }
    navigator.serviceWorker.register(swUrl).catch(function () {});
  }

  // 読み込みが済むまでは書けないようにしておく（数ミリ秒）
  pad.readOnly = true;
  fit(); syncAdd();
  try { pad.focus(); } catch (e) {}
  load().catch(function () {
    showToast('この端末では保存が使えません', null);
  }).then(function () {
    ready = true;
    pad.readOnly = false;
    // 起動のたびに新しい紙。前回の書きかけは付箋にしておく
    pad.value = state.draft || '';
    commitDraft();
    fit(); syncAdd(); render();
  });
})();
</script>
</body>
</html>
