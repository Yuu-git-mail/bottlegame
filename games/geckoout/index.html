<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ヤモリの穴 - ゲーム集</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .stage { touch-action: none; }
    .stage-canvas { border-radius: 12px; }
    .ctl-btn.sm { min-width: 64px; font-size: 15px; padding: 0 10px; }
    .overlay.lv { overflow-y: auto; -webkit-overflow-scrolling: touch; justify-content: flex-start; gap: 8px; padding: 10px; }
    .overlay.lv h2 { font-size: 20px; flex: 0 0 auto; }
    .overlay.lv p, .overlay.lv .btn-row { flex: 0 0 auto; }
    .lv-grid { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 460px; }
    .lv-btn {
      width: 50px; height: 44px; border-radius: 8px;
      border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
      font-size: 16px; font-weight: 700; display: inline-flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; line-height: 1.1;
    }
    .lv-btn .st { font-size: 9px; color: var(--warn); letter-spacing: -1px; }
    .lv-btn.done { background: rgba(46, 204, 113, 0.22); border-color: var(--ok); }
    .lv-btn.done::after { content: '✓'; position: absolute; top: -3px; right: 3px; font-size: 10px; color: var(--ok); }
    .lv-btn.now { outline: 2px solid var(--warn); }
    .overlay .sub { color: var(--muted); font-size: 14px; margin: 0; }
    .overlay .stars { font-size: 34px; color: var(--warn); letter-spacing: 4px; }
    .overlay .stars .off { color: rgba(255,255,255,0.18); }
  </style>
</head>
<body class="game">
  <div class="app">
    <header class="app-bar" data-title="ヤモリの穴" data-back="../index.html" data-reset></header>
    <div class="app-hud">
      <span class="hud-item" id="hud-level">面<b id="level">1</b></span>
      <span class="hud-item">手数<b id="moves">0</b></span>
      <span class="hud-item">最短<b id="opt">0</b></span>
      <span class="hud-item">残り<b id="left">0</b></span>
    </div>
    <main class="app-main">
      <div class="stage" id="stage">
        <canvas class="stage-canvas" id="cv"></canvas>
      </div>
      <div id="help-sheet" class="sheet hidden">
        <div class="sheet-body">
          <h3>遊び方</h3>
          <ul>
            <li>ヤモリの頭か尻尾を指で掴んで引っ張ると、体がついてくる。</li>
            <li>同じ色の穴にどちらかの端が入ると、体ごと吸い込まれる。</li>
            <li>全部のヤモリを穴に入れたらクリア。壁・他のヤモリ・自分の体はまたげない。</li>
            <li>🔑 を通ると 🔒 の扉が開く。点線の穴は 1 回しか使えない。</li>
            <li>手数が最短に近いほど ★ が増える。</li>
          </ul>
          <h3>操作</h3>
          <ul>
            <li>スマホ: 頭か尻尾をドラッグ</li>
            <li>PC: 頭か尻尾をクリックして選び、矢印キー。Z 戻す、H ヒント、R やり直し</li>
            <li>戻す・ヒントは何回でも使える。</li>
          </ul>
        </div>
      </div>
    </main>
    <div class="app-controls">
      <button type="button" class="ctl-btn sm" id="btn-undo">↶ 戻す</button>
      <button type="button" class="ctl-btn sm" id="btn-hint">💡 ヒント</button>
      <button type="button" class="ctl-btn sm" id="btn-restart">やり直し</button>
      <button type="button" class="ctl-btn sm" id="btn-list">面一覧</button>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script>
  /*CORE*/
  // 盤面の論理部分。node のソルバー(テスト)もこのブロックをそのまま使う。
  var GeckoCore = (function () {

    function buildSolutionKeys() {
      solKeys = {};
      var sol = LEVELS[lvIndex].s;
      if (!sol) return;
      var T = C.initState(L);
      for (var i = 0; i < sol.length; i++) {
        solKeys[C.key(T)] = { gi: sol[i][0], end: sol[i][1], dir: sol[i][2] };
        var r = C.apply(L, T, sol[i][0], sol[i][1], sol[i][2]);
        if (!r) break;
        T = r.S;
      }
    }
    // Worker(Blob で CORE を読み込む)。無ければ null
    var worker = null, workerFailed = false, pending = null;
    function coreSource() {
      var scripts = document.getElementsByTagName('script');
      for (var i = 0; i < scripts.length; i++) {
        var t = scripts[i].textContent || '';
        var a = t.indexOf('/*CORE*/'), b = t.indexOf('/*ENDCORE*/');
        if (a >= 0 && b > a) return t.slice(a, b);
      }
      return null;
    }
    function getWorker() {
      if (worker || workerFailed) return worker;
      try {
        if (!window.Worker || !window.Blob || !window.URL || !window.URL.createObjectURL) { workerFailed = true; return null; }
        var src = coreSource();
        if (!src) { workerFailed = true; return null; }
        src += '\nself.onmessage = function (e) { var d = e.data; var L = GeckoCore.parse(d.def); var r = GeckoCore.solve(L, d.S, d.budget); if (r.status === "budget") r = GeckoCore.solve(L, d.S, d.budget, 4); self.postMessage({ id: d.id, status: r.status, mv: r.path && r.path.length ? r.path[0] : null }); };';
        var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
        worker = new Worker(url);
        worker.onmessage = function (e) { onHintResult(e.data); };
        worker.onerror = function () { workerFailed = true; try { worker.terminate(); } catch (er) { /* ignore */ } worker = null; if (pending) { var p = pending; pending = null; hintSync(p.S); } };
      } catch (e) { workerFailed = true; worker = null; }
      return worker;
    }
    var hintSeq = 0;
    function onHintResult(d) {
      if (!pending || d.id !== pending.id) return;
      var p = pending; pending = null;
      if (C.key(S) !== p.key) return;   // 計算中に動かした
      applyHint(d.status, d.mv);
    }
    function applyHint(status, mv) {
      if (status === 'ok' && mv) { hint = mv; hintT = 0; H.toast('光っている方へ 1 マス'); }
      else if (status === 'none') showStuck(true);
      else H.toast('この形は読み切れません。戻すか、やり直しを');
    }
    function hintSync(S0) {
      var r = C.solve(L, S0, 250000);
      if (r.status === 'budget') r = C.solve(L, S0, 250000, 4);
      if (C.key(S) !== C.key(S0)) return;
      applyHint(r.status, r.path && r.path.length ? r.path[0] : null);
    }
    function showHint() {
      if (busy || won) return;
      var k = C.key(S);
      if (solKeys[k]) { hint = solKeys[k]; hintT = 0; H.toast('光っている方へ 1 マス'); return; }
      if (pending) { H.toast('考え中…'); return; }
      var w = getWorker();
      if (w) {
        pending = { id: ++hintSeq, key: k, S: S };
        H.toast('考え中…', 4000);
        w.postMessage({ id: pending.id, def: LEVELS[lvIndex], S: S, budget: 250000 });
      } else {
        H.toast('考え中…');
        var S0 = S;
        setTimeout(function () { hintSync(S0); }, 30);
      }
    }

    // ---------- 入力 ----------
    function grabAt(idx) {
      for (var gi = 0; gi < S.g.length; gi++) {
        var c = S.g[gi];
        if (!c) continue;
        if (c[0] === idx) return { gi: gi, end: 0 };
        if (c[c.length - 1] === idx) return { gi: gi, end: 1 };
        for (var j = 1; j < c.length - 1; j++) if (c[j] === idx) return { gi: gi, end: j * 2 < c.length ? 0 : 1 };
      }
      return null;
    }
    function onDown(x, y) {
      if (busy || won || !L) return;
      var idx = cellAt(x, y);
      if (idx < 0) return;
      var g = grabAt(idx);
      if (!g) { drag = null; return; }
      drag = { gi: g.gi, end: g.end, changed: false, prev: snapshot() };
      sel = { gi: g.gi, end: g.end };
      H.audio.click();
    }
    function onMove(x, y) {
      if (!drag) return;
      var idx = cellAt(x, y);
      if (idx < 0) return;
      pullTo(idx);
    }
    function onUp() {
      if (!drag) return;
      if (drag.changed) pushUndo(drag.prev);
      drag = null;
    }
    if (window.PointerEvent) {
      canvas.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse' && e.button !== 0) return; try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } onDown(e.clientX, e.clientY); });
      canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
    } else {
      canvas.addEventListener('touchstart', function (e) { var t = e.touches[0]; if (t) onDown(t.clientX, t.clientY); }, { passive: true });
      canvas.addEventListener('touchmove', function (e) { var t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, { passive: true });
      canvas.addEventListener('touchend', onUp);
      canvas.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY); });
      canvas.addEventListener('mousemove', function (e) { if (e.buttons) onMove(e.clientX, e.clientY); });
      canvas.addEventListener('mouseup', onUp);
    }
    function keyMove(d) {
      if (busy || won || !sel || !S.g[sel.gi]) return;
      var prev = snapshot();
      if (step(sel.gi, sel.end, d)) { pushUndo(prev); afterMove(); }
      else H.audio.bad();
    }
    H.keys({
      ArrowUp: function () { keyMove(0); }, ArrowRight: function () { keyMove(1); },
      ArrowDown: function () { keyMove(2); }, ArrowLeft: function () { keyMove(3); },
      z: undo, Z: undo, h: showHint, H: showHint, r: restart, R: restart,
      Tab: function () {
        var alive = [];
        for (var i = 0; i < S.g.length; i++) if (S.g[i]) alive.push(i);
        if (!alive.length) return;
        var cur = sel ? alive.indexOf(sel.gi) : -1;
        sel = { gi: alive[(cur + 1) % alive.length], end: 0 };
      }
    });
    H.holdButton(document.getElementById('btn-undo'), undo, null, 250);
    H.holdButton(document.getElementById('btn-hint'), showHint);
    H.holdButton(document.getElementById('btn-restart'), function () { H.audio.click(); restart(); });
    H.holdButton(document.getElementById('btn-list'), function () { H.audio.click(); showLevels(); });
    document.getElementById('hud-level').addEventListener('click', function () { if (overlayEl) closeOverlay(); else showLevels(); });

    // ---------- 画面 ----------
    function closeOverlay() { if (overlayEl) { overlayEl.close(); overlayEl = null; } }
    function starHtml(n) {
      var s = '';
      for (var i = 0; i < 3; i++) s += i < n ? '★' : '<span class="off">★</span>';
      return '<span class="stars">' + s + '</span>';
    }
    function showClear() {
      busy = true;
      var st = starsFor(moves, L.opt);
      if (!stars[lvIndex] || stars[lvIndex] < st) { stars[lvIndex] = st; store.set('stars', stars); }
      H.audio.win();
      var last = lvIndex >= LEVELS.length - 1;
      var html = starHtml(st) + '<br><span class="sub">' + moves + ' 手（最短 ' + L.opt + ' 手）</span>';
      var buttons = [];
      if (!last) buttons.push({ label: '次の面', onClick: function () { overlayEl = null; loadLevel(lvIndex + 1); } });
      buttons.push({ label: 'もう一度', secondary: true, onClick: function () { overlayEl = null; loadLevel(lvIndex); } });
      buttons.push({ label: '面一覧', secondary: true, onClick: function () { overlayEl = null; showLevels(); } });
      overlayEl = H.overlay({ title: last ? '全面クリア!' : 'クリア!', html: html, buttons: buttons });
    }
    function showStuck(unsolvable) {
      closeOverlay();
      H.audio.bad();
      overlayEl = H.overlay({ title: '手がありません', html: unsolvable ? 'この形からは全部入れられません。' : '動かせるヤモリがいません。',
        buttons: [{ label: '戻す', onClick: function () { overlayEl = null; undo(); } },
                  { label: 'やり直し', secondary: true, onClick: function () { overlayEl = null; restart(); } }] });
    }
    function showLevels() {
      closeOverlay();
      var n = 0, i;
      for (i = 0; i < LEVELS.length; i++) if (stars[i]) n++;
      var html = '<span class="sub">クリア ' + n + ' / ' + LEVELS.length + ' 面</span><br><span class="lv-grid">';
      for (i = 0; i < LEVELS.length; i++) {
        var st = stars[i] || 0, s = '';
        for (var k = 0; k < st; k++) s += '★';
        html += '<button type="button" class="lv-btn' + (st ? ' done' : '') + (i === lvIndex ? ' now' : '') + '" data-i="' + i + '">' + (i + 1) + (st ? '<span class="st">' + s + '</span>' : '') + '</button>';
      }
      html += '</span>';
      overlayEl = H.overlay({ title: '面を選ぶ', html: html, buttons: [{ label: '閉じる', secondary: true, onClick: function () { overlayEl = null; } }] });
      overlayEl.className += ' lv scrollable';
      var btns = overlayEl.querySelectorAll('.lv-btn');
      for (i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function (e) {
          var idx = parseInt(e.currentTarget.getAttribute('data-i'), 10);
          H.audio.click(); loadLevel(idx);
        });
      }
    }
    window.resetGame = function () { restart(); };

    // ---------- 描画 ----------
    function rrect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function drawBoard() {
      ctx.fillStyle = '#141428';
      ctx.fillRect(0, 0, baseW, baseH);
      for (var idx = 0; idx < L.w * L.h; idx++) {
        if (L.wall[idx]) continue;
        var x = cx(idx) - CS / 2, y = cy(idx) - CS / 2;
        ctx.fillStyle = '#2a2a4a';
        rrect(x + 1.5, y + 1.5, CS - 3, CS - 3, 6); ctx.fill();
        ctx.fillStyle = '#34345a';
        rrect(x + 1.5, y + 1.5, CS - 3, CS - 8, 6); ctx.fill();
        if (L.door[idx]) {
          if (S.door) {
            ctx.strokeStyle = 'rgba(245,176,65,0.45)'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]);
            rrect(x + 5, y + 5, CS - 10, CS - 10, 6); ctx.stroke(); ctx.setLineDash([]);
          } else {
            ctx.fillStyle = '#7a5a2a'; rrect(x + 3, y + 3, CS - 6, CS - 6, 6); ctx.fill();
            ctx.fillStyle = '#a97c3a'; rrect(x + 3, y + 3, CS - 6, CS - 12, 6); ctx.fill();
            ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🔒', x + CS / 2, y + CS / 2 + 1);
          }
        }
        if (L.key[idx] && !S.used[idx]) {
          ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('🔑', x + CS / 2, y + CS / 2 + 1);
        }
        var hole = L.hole[idx];
        if (hole) {
          var pal = PALETTE[hole.c], used = hole.once && S.used[idx];
          ctx.beginPath(); ctx.arc(x + CS / 2, y + CS / 2, CS * 0.40, 0, Math.PI * 2);
          ctx.fillStyle = used ? '#3a3a55' : pal.main; ctx.fill();
          if (hole.once && !used) { ctx.setLineDash([4, 4]); ctx.lineWidth = 2.5; ctx.strokeStyle = pal.light; ctx.stroke(); ctx.setLineDash([]); }
          ctx.beginPath(); ctx.arc(x + CS / 2, y + CS / 2, CS * 0.28, 0, Math.PI * 2);
          ctx.fillStyle = used ? '#2a2a40' : '#101020'; ctx.fill();
          if (used) { ctx.strokeStyle = '#5a5a75'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + CS * 0.35, y + CS * 0.35); ctx.lineTo(x + CS * 0.65, y + CS * 0.65); ctx.moveTo(x + CS * 0.65, y + CS * 0.35); ctx.lineTo(x + CS * 0.35, y + CS * 0.65); ctx.stroke(); }
        }
      }
    }
    function drawGecko(gi, now) {
      var g = geckos[gi];
      if (!g.alive) return;
      var pal = PALETTE[g.c], segs = g.segs, n = segs.length, i;
      var shrink = 1;
      if (g.sink) shrink = Math.max(0, 1 - g.sink.t);
      if (shrink <= 0) return;
      var bw = CS * 0.62 * shrink;
      var selected = sel && sel.gi === gi && !g.sink;
      // 影 + 縁
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      function path() {
        ctx.beginPath(); ctx.moveTo(segs[0].x, segs[0].y);
        for (i = 1; i < n; i++) ctx.lineTo(segs[i].x, segs[i].y);
      }
      if (n === 1) { ctx.beginPath(); ctx.arc(segs[0].x, segs[0].y, 1, 0, 7); }
      path(); ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = bw + 6; ctx.stroke();
      path(); ctx.strokeStyle = selected ? '#ffffff' : pal.dark; ctx.lineWidth = bw + 4; ctx.stroke();
      path(); ctx.strokeStyle = pal.main; ctx.lineWidth = bw; ctx.stroke();
      // 背中のハイライト
      path(); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = bw * 0.35; ctx.stroke();
      // 模様(色ごと)
      var pat = 'rgbyop'.indexOf(g.c) % 3;
      for (i = 1; i < n - 1; i++) {
        var s = segs[i];
        ctx.fillStyle = pal.dark;
        if (pat === 0) { ctx.beginPath(); ctx.arc(s.x, s.y, bw * 0.16, 0, Math.PI * 2); ctx.fill(); }
        else if (pat === 1) {
          var dx = segs[i - 1].x - s.x, dy = segs[i - 1].y - s.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
          dx /= len; dy /= len;
          ctx.strokeStyle = pal.dark; ctx.lineWidth = 3 * shrink; ctx.beginPath();
          ctx.moveTo(s.x - dy * bw * 0.22 - dx * bw * 0.12, s.y + dx * bw * 0.22 - dy * bw * 0.12);
          ctx.lineTo(s.x + dx * bw * 0.16, s.y + dy * bw * 0.16);
          ctx.lineTo(s.x + dy * bw * 0.22 - dx * bw * 0.12, s.y - dx * bw * 0.22 - dy * bw * 0.12); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(s.x - bw * 0.18, s.y - bw * 0.12, bw * 0.1, 0, 7); ctx.arc(s.x + bw * 0.18, s.y + bw * 0.12, bw * 0.1, 0, 7); ctx.fill();
        }
      }
      // 尻尾の先
      if (n >= 2) {
        var t = segs[n - 1], u = segs[n - 2];
        var tx = t.x - u.x, ty = t.y - u.y, tl = Math.sqrt(tx * tx + ty * ty) || 1;
        ctx.beginPath(); ctx.arc(t.x + tx / tl * bw * 0.25, t.y + ty / tl * bw * 0.25, bw * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = pal.main; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = pal.dark; ctx.stroke();
      }
      // 頭
      var hd = segs[0], hx = 0, hy = -1;
      if (n >= 2) { hx = hd.x - segs[1].x; hy = hd.y - segs[1].y; var hl = Math.sqrt(hx * hx + hy * hy) || 1; hx /= hl; hy /= hl; }
      ctx.beginPath(); ctx.arc(hd.x, hd.y, bw * 0.66, 0, Math.PI * 2);
      ctx.fillStyle = pal.main; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = selected ? '#ffffff' : pal.dark; ctx.stroke();
      // 目(進行方向に向いて並ぶ)
      var ex = -hy, ey = hx, eo = bw * 0.36, ef = bw * 0.18;
      for (i = -1; i <= 1; i += 2) {
        var px = hd.x + ex * eo * i + hx * ef, py = hd.y + ey * eo * i + hy * ef;
        ctx.beginPath(); ctx.arc(px, py, bw * 0.2, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(px + hx * bw * 0.07, py + hy * bw * 0.07, bw * 0.1, 0, 7); ctx.fillStyle = '#1a1a2e'; ctx.fill();
      }
      // 手足(4 本の小さな点)
      if (n >= 2 && shrink > 0.5) {
        ctx.fillStyle = pal.dark;
        var la = n > 2 ? 1 : 0, lb = n - 2;
        [la, lb].forEach(function (k, j) {
          if (k < 0 || k >= n || (j === 1 && lb === la)) return;
          var s = segs[k], nx = segs[k + 1] || segs[k - 1];
          var dx = nx.x - s.x, dy = nx.y - s.y, dl = Math.sqrt(dx * dx + dy * dy) || 1;
          var ox = -dy / dl, oy = dx / dl;
          ctx.beginPath(); ctx.arc(s.x + ox * bw * 0.62, s.y + oy * bw * 0.62, bw * 0.13, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(s.x - ox * bw * 0.62, s.y - oy * bw * 0.62, bw * 0.13, 0, 7); ctx.fill();
        });
      }
    }
    function drawHint(now) {
      if (!hint || !S.g[hint.gi]) return;
      var c = S.g[hint.gi];
      var lead = hint.end === 0 ? c[0] : c[c.length - 1];
      var tx = lead % L.w + C.DIRS[hint.dir][0], ty = Math.floor(lead / L.w) + C.DIRS[hint.dir][1];
      var pulse = 0.5 + 0.5 * Math.sin(now / 160);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * pulse) + ')'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx(lead), cy(lead), CS * 0.42 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
      var ax = cx(ty * L.w + tx), ay = cy(ty * L.w + tx);
      var dx = C.DIRS[hint.dir][0], dy = C.DIRS[hint.dir][1];
      ctx.fillStyle = 'rgba(255,255,255,' + (0.6 + 0.4 * pulse) + ')';
      ctx.beginPath();
      ctx.moveTo(ax + dx * 12, ay + dy * 12);
      ctx.lineTo(ax - dx * 8 + dy * 10, ay - dy * 8 + dx * 10);
      ctx.lineTo(ax - dx * 8 - dy * 10, ay - dy * 8 - dx * 10);
      ctx.closePath(); ctx.fill();
    }
    function draw(now) {
      if (!ctx || !L) return;
      now = now || performance.now();
      ctx.clearRect(0, 0, baseW, baseH);
      drawBoard();
      // 穴に入る途中のものを先に(下に)描く
      for (var gi = 0; gi < geckos.length; gi++) if (geckos[gi].sink) drawGecko(gi, now);
      for (gi = 0; gi < geckos.length; gi++) if (!geckos[gi].sink) drawGecko(gi, now);
      drawHint(now);
    }

    // ---------- アニメ ----------
    var last = performance.now();
    function tick(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      var k = 1 - Math.pow(0.0005, dt);  // なめらかな追従
      for (var gi = 0; gi < geckos.length; gi++) {
        var g = geckos[gi];
        if (!g.alive) continue;
        var target = S.g[gi];
        if (g.sink) {
          var hx = cx(g.sink.hole), hy = cy(g.sink.hole);
          g.sink.t += dt / (0.25 + g.segs.length * 0.09);
          // 先頭から順に穴へ流れ込む
          for (var i = 0; i < g.segs.length; i++) {
            var s = g.segs[i], lead = i === 0 ? { x: hx, y: hy } : g.segs[i - 1];
            var tx = i === 0 ? hx : lead.x, ty = i === 0 ? hy : lead.y;
            var kk = 1 - Math.pow(0.0001, dt);
            s.x += (tx - s.x) * kk; s.y += (ty - s.y) * kk;
          }
          if (g.sink.t >= 1) { g.alive = false; }
          continue;
        }
        if (!target) { g.alive = false; continue; }
        for (i = 0; i < target.length && i < g.segs.length; i++) {
          var tx2 = cx(target[i]), ty2 = cy(target[i]);
          g.segs[i].x += (tx2 - g.segs[i].x) * k; g.segs[i].y += (ty2 - g.segs[i].y) * k;
        }
      }
      draw(now);
      window.requestAnimationFrame(tick);
    }
    window.requestAnimationFrame(tick);

    // ---------- 開始 ----------
    var lastLv = store.get('last', 0);
    if (lastLv >= LEVELS.length) lastLv = 0;
    loadLevel(lastLv);
    setTimeout(layout, 50);
    setTimeout(layout, 400);
    if (!stars.length && lastLv === 0) {
      overlayEl = H.overlay({ title: 'ヤモリの穴', html: 'ヤモリの頭か尻尾を引っ張って<br>同じ色の穴へ入れよう',
        buttons: [{ label: 'スタート', onClick: function () { overlayEl = null; } }] });
    }
  })();
  </script>
</body>
</html>
